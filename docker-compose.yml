services:
  postgres:
    image: postgres:16
    container_name: resourcebooking_postgres
    restart: always
    environment:
      POSTGRES_DB: resourcebooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
